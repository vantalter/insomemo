[package]
name = "input-switcher"
version = "0.1.0"
edition = "2024"
description = "Event-driven, context-aware keyboard layout memory"
license = "MIT"
build = "build.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

