[package]
name = "insomemo"
version = "0.3.0-rc.2"
edition = "2024"
description = "Event-driven, context-aware keyboard layout memory"
license = "MIT"
repository = "https://github.com/vantalter/insomemo"
readme = "README.md"
keywords = ["keyboard-layout", "input-source", "tray", "macos", "linux"]
categories = ["command-line-utilities", "os"]
# Distributed through GitHub releases, not crates.io.
publish = false
build = "build.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

