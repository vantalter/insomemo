# .deb and .rpm packages, built by the release workflow with nfpm:
#   VERSION=0.2.1 ARCH=arm64 nfpm package -f packaging/linux/nfpm.yaml -p deb -t OUTDIR
# ARCH uses Go names (amd64, arm64); nfpm maps them per format.
name: insomemo
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Ivan Talakhovskyy <ivan.talakhovskyy@gmail.com>
homepage: https://github.com/vantalter/insomemo
license: MIT
description: |-
  Remembers your keyboard layout per window, tab, and conversation.
  Insomemo learns the layout you choose in each context and restores it
  when you return. Supports X11, Sway, and Hyprland with a StatusNotifier tray.

contents:
  - src: target/release/insomemo
    dst: /usr/bin/insomemo
    file_info:
      mode: 0755
  - src: packaging/insomemo.desktop
    dst: /usr/share/applications/insomemo.desktop
  # Not enabled automatically: `systemctl --user enable --now insomemo`.
  - src: packaging/linux/insomemo.service
    dst: /usr/lib/systemd/user/insomemo.service
  - src: README.md
    dst: /usr/share/doc/insomemo/README.md
  - src: LICENSE
    dst: /usr/share/doc/insomemo/LICENSE

overrides:
  deb:
    depends:
      - libglib2.0-0 | libglib2.0-0t64
      - libjson-glib-1.0-0
      - libx11-6
      - libxkbcommon0
      - libgdk-pixbuf-2.0-0
      - curl
  # Shared-library names rather than package names, which differ between
  # Fedora and openSUSE. "(64bit)" is RPM's marker for 64-bit libraries.
  rpm:
    depends:
      - libglib-2.0.so.0()(64bit)
      - libgio-2.0.so.0()(64bit)
      - libgobject-2.0.so.0()(64bit)
      - libjson-glib-1.0.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libgdk_pixbuf-2.0.so.0()(64bit)
      - curl
