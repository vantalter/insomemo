name: release-please
# Keeps a release pull request open that bumps Cargo.toml and Cargo.lock and
# updates CHANGELOG.md from the Conventional Commits merged to main. Merging it
# creates the tag and a draft release, then runs release.yml, which builds the
# files, attaches them, and publishes the release. A tag pushed with the
# workflow's own token starts no other workflow, so this one runs it.
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  release:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    secrets: inherit
