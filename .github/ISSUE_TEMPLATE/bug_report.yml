name: Bug report
description: Something does not work as described in the README.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Window titles can contain private information. Check logs and screenshots before attaching them.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Insomemo version
      description: Output of `insomemo --version`, or the release you installed.
      placeholder: insomemo 0.2.10
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux X11
        - Linux Sway
        - Linux Hyprland
        - Other
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System details
      description: OS version, desktop environment, and on Linux the tray host (for example KDE, Waybar, Cinnamon, Enlightenment).
      placeholder: Ubuntu 24.04, KDE Plasma 6
  - type: input
    id: app
    attributes:
      label: App involved
      description: The app whose window or tab did not switch correctly, if any.
      placeholder: Firefox, Slack, Ghostty
  - type: textarea
    id: logs
    attributes:
      label: Terminal output
      description: Run `insomemo` from a terminal and paste anything it prints.
      render: text
