name: Bug report
description: Something does not work as described in the README.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Issues are public. Window titles can contain private information, so check screenshots
        and terminal output before attaching them. Report a Problem… in Insomemo fills in the
        version, platform, and system for you.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Insomemo version
      description: Shown in Settings → Updates on macOS, or by `insomemo --version`.
      placeholder: insomemo 0.3.3
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux X11
        - Linux Sway
        - Linux Hyprland
        - Other
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System details
      description: OS version and processor; on Linux, the desktop environment and tray host (for example KDE, Waybar, Cinnamon, Enlightenment).
      placeholder: macOS 15.5, aarch64
  - type: input
    id: app
    attributes:
      label: App involved
      description: The app whose window or tab did not switch correctly, if any.
      placeholder: Firefox, Slack, Ghostty
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: >-
        On macOS, attach the debug log: turn on Record switching events in Settings → General,
        reproduce the problem, then choose Show Log and drag the file here. It shows titles and
        sites only as short codes. On Linux, run `insomemo` from a terminal and paste anything it
        prints.
